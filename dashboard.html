<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Study Planner Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            StudyPlanner
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>



    <!-- Dashboard -->

    <main class="dashboard">


        <h1>
            Welcome to Your Study Planner 👋
        </h1>


        <p class="dashboard-subtitle">
            Organize your studies and stay on track.
        </p>



        <!-- Statistics -->

        <div class="dashboard-cards">


            <div class="dashboard-card">

                <h3>
                    📚 Subjects
                </h3>

                <p id="subjectCount">
                    0 Subjects
                </p>

            </div>



            <div class="dashboard-card">

                <h3>
                    ✅ Tasks
                </h3>

                <p id="pendingCount">
                    0 Pending Tasks
                </p>

            </div>



            <div class="dashboard-card">

                <h3>
                    📅 Today's Plan
                </h3>

                <p id="todayCount">
                    0 Tasks Planned
                </p>

            </div>



            <div class="dashboard-card">

                <h3>
                    📊 Progress
                </h3>

                <p id="progressCount">
                    0% Completed
                </p>

            </div>


        </div>



        <!-- Subject Section -->

        <section class="planner-section">

            <h2>
                📚 My Subjects
            </h2>


            <div class="input-area">

                <input
                    type="text"
                    id="subjectInput"
                    placeholder="Enter a subject..."
                >

                <button onclick="addSubject()">
                    Add Subject
                </button>

            </div>


            <ul id="subjectList"></ul>

        </section>
        <!-- Study Schedule -->

<section class="planner-section">

    <h2>📅 Study Schedule</h2>

    <div class="schedule-form">

        <input
            type="text"
            id="scheduleSubject"
            placeholder="Subject"
        >

        <input
            type="text"
            id="scheduleTopic"
            placeholder="What will you study?"
        >

        <input
            type="date"
            id="scheduleDate"
        >

        <input
            type="time"
            id="scheduleTime"
        >

        <button onclick="addSchedule()">
            Add to Schedule
        </button>

    </div>

    <div id="scheduleList"></div>

</section>


        <!-- Task Section -->

        <section class="planner-section">

            <h2>
                ✅ My Tasks
            </h2>


            <div class="input-area">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                >

                <button onclick="addTask()">
                    Add Task
                </button>

            </div>


            <ul id="taskList"></ul>

        </section>



    </main>



    <!-- JavaScript -->

    <script src="script.js"></script>


</body>

</html>
